<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badminton - Ongoing Matches Display</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#07130d;
    color:#fff;
}
.header{
    background:#166534;
    padding:18px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}
.header h1{margin:0;font-size:30px}
.header-right{text-align:right}
.clock{font-family:monospace;font-size:22px}
.live{font-size:12px;color:#bbf7d0;margin-top:3px}

.container{max-width:1800px;margin:auto;padding:22px}

.section-title{
    font-size:23px;
    font-weight:bold;
    margin:5px 0 14px;
}

.courts{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:18px;
}

.court{
    background:#10251a;
    border:2px solid #28543a;
    border-radius:15px;
    padding:18px;
    min-height:330px;
    box-shadow:0 5px 18px #0005;
}
.court.playing{border-color:#ef4444}
.court.available{border-color:#22c55e}

.court-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}
.court-name{font-size:25px;font-weight:bold}
.status{
    padding:7px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    background:#166534;
}
.status.playing{background:#dc2626}
.status.available{background:#16a34a}

.players{
    margin-top:16px;
    min-height:120px;
}
.player{
    background:#173523;
    border-radius:8px;
    padding:11px 13px;
    margin:7px 0;
    font-size:21px;
}
.player small{
    color:#a7f3d0;
    font-size:12px;
}

.timer{
    text-align:center;
    font-family:monospace;
    font-size:42px;
    font-weight:bold;
    margin:16px 0;
}
.shuttle{
    text-align:center;
    color:#cbd5e1;
    font-size:15px;
}

.empty{
    text-align:center;
    color:#94a3b8;
    padding:38px 10px;
}

.next-section{
    margin-top:24px;
    background:#10251a;
    border:2px solid #2563eb;
    border-radius:15px;
    padding:20px;
}
.next-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}
.next-court{
    background:#1d4ed8;
    padding:8px 13px;
    border-radius:20px;
    font-weight:bold;
}
.next-players{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}
.next-player{
    background:#173523;
    border-radius:8px;
    padding:12px 16px;
    font-size:20px;
}

.waiting-section{
    margin-top:24px;
    background:#10251a;
    border-radius:15px;
    padding:20px;
}
.waiting-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}
.waiting-player{
    background:#173523;
    padding:10px 14px;
    border-radius:8px;
    font-size:17px;
}
.waiting-player.alert{
    background:#991b1b;
    color:#fff;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:#64748b;
    font-size:12px;
    padding:20px;
}

@media(max-width:700px){
    .header h1{font-size:22px}
    .container{padding:12px}
    .timer{font-size:34px}
    .court-name{font-size:21px}
    .player{font-size:18px}
}
</style>
</head>

<body>

<header class="header">
    <h1>🏸 BADMINTON ONGOING MATCHES</h1>
    <div class="header-right">
        <div id="clock" class="clock">--:--:--</div>
        <div class="live">● LIVE DISPLAY</div>
    </div>
</header>

<main class="container">

    <div class="section-title">
        🔴 Ongoing Matches / Courts
    </div>

    <div id="courts" class="courts"></div>

    <section class="next-section">
        <div class="next-header">
            <div class="section-title" style="margin:0">
                ⏭ Next Match
            </div>
            <div id="nextCourt" class="next-court">
                Waiting for available court
            </div>
        </div>

        <div id="nextMatch"></div>
    </section>

    <section class="waiting-section">
        <div class="section-title">
            👥 Waiting Players
        </div>
        <div id="waiting" class="waiting-list"></div>
    </section>

</main>

<div class="footer">
    This display automatically follows the Badminton Queue Manager.
</div>

<script>
/*
=========================================================
IMPORTANT
=========================================================
This MUST match the STORAGE_KEY used by QMASTER.html.
The current Queue Master uses:

badmintonQueueManagerData_v6
*/
const STORAGE_KEY = "badmintonQueueManagerData_v6";

let allPlayers = [];
let waitingQueue = [];
let matches = [];
let courts = [];

function escapeHTML(text){
    const div=document.createElement("div");
    div.textContent=text ?? "";
    return div.innerHTML;
}

function getPlayer(id){
    return allPlayers.find(player => player.id === id);
}

function formatTime(seconds){
    seconds=Math.max(0,Number(seconds)||0);

    const hours=Math.floor(seconds/3600);
    const minutes=Math.floor((seconds%3600)/60);
    const secs=seconds%60;

    return String(hours).padStart(2,"0")+":"+
           String(minutes).padStart(2,"0")+":"+
           String(secs).padStart(2,"0");
}

function getWaitingSeconds(player){
    if(!player || !player.waitingSince) return 0;

    return Math.max(
        0,
        Math.floor((Date.now()-player.waitingSince)/1000)
    );
}

function loadData(){
    try{
        const saved=localStorage.getItem(STORAGE_KEY);

        if(!saved){
            allPlayers=[];
            waitingQueue=[];
            matches=[];
            courts=[];
            return;
        }

        const data=JSON.parse(saved);

        allPlayers=Array.isArray(data.allPlayers)
            ? data.allPlayers
            : [];

        waitingQueue=Array.isArray(data.waitingQueue)
            ? data.waitingQueue
            : [];

        matches=Array.isArray(data.matches)
            ? data.matches
            : [];

        courts=Array.isArray(data.courts)
            ? data.courts
            : [];

    }catch(error){
        console.error("Unable to read queue data:",error);
    }
}

/*
=========================================================
COURTS
=========================================================
Every court stored in Queue Master is automatically shown.
So if you add Court 5, Court 6, etc., this display adjusts
automatically without changing this HTML.
*/
function renderCourts(){

    const container=document.getElementById("courts");

    if(!courts.length){
        container.innerHTML=`
            <div class="empty">
                No courts have been added yet.
            </div>
        `;
        return;
    }

    container.innerHTML=courts.map(court=>{

        const match=court.match;

        let elapsed=Number(court.elapsed)||0;

        if(court.playing && court.startTime){
            elapsed=Math.floor(
                (Date.now()-court.startTime)/1000
            );
        }

        const statusClass=court.playing
            ? "playing"
            : "available";

        const statusText=court.playing
            ? "🔴 PLAYING"
            : "🟢 AVAILABLE";

        let playerHTML="";

        if(match && Array.isArray(match.playerIds)){

            playerHTML=match.playerIds.map(id=>{

                const player=getPlayer(id);

                if(!player) return "";

                return `
                    <div class="player">
                        🏸 ${escapeHTML(player.name)}
                        <small>
                            (${escapeHTML(player.category || "")})
                        </small>
                    </div>
                `;

            }).join("");

        }else{

            playerHTML=`
                <div class="empty">
                    Available for next match
                </div>
            `;
        }

        return `
            <article class="court ${statusClass}">

                <div class="court-header">

                    <div class="court-name">
                        🏸 ${escapeHTML(court.name)}
                    </div>

                    <div class="status ${statusClass}">
                        ${statusText}
                    </div>

                </div>

                <div class="players">
                    ${playerHTML}
                </div>

                ${
                    match
                    ? `
                        <div class="shuttle">
                            🏸 Shuttle:
                            <strong>
                                ${escapeHTML(court.shuttle || "LM10")}
                            </strong>
                        </div>

                        <div class="timer">
                            ${formatTime(elapsed)}
                        </div>
                    `
                    : ""
                }

            </article>
        `;

    }).join("");
}

/*
=========================================================
NEXT AVAILABLE COURT
=========================================================
The first available court in the court list is selected.
If all courts are occupied, the display says:
"No court available yet".
*/
function getNextAvailableCourt(){

    return courts.find(court => court.match === null) || null;
}

/*
=========================================================
NEXT MATCH
=========================================================
Shows the first ready match in the Ready Matches queue.
It does NOT remove or modify the match.
*/
function renderNextMatch(){

    const nextCourtElement=document.getElementById("nextCourt");
    const nextMatchElement=document.getElementById("nextMatch");

    const nextCourt=getNextAvailableCourt();
    const nextMatch=matches.length ? matches[0] : null;

    if(nextCourt){
        nextCourtElement.textContent =
            "NEXT → " + nextCourt.name;
    }else{
        nextCourtElement.textContent =
            "ALL COURTS OCCUPIED";
    }

    if(!nextMatch){

        nextMatchElement.innerHTML=`
            <div class="empty">
                No ready match at the moment.
            </div>
        `;

        return;
    }

    const players=Array.isArray(nextMatch.playerIds)
        ? nextMatch.playerIds
        : [];

    nextMatchElement.innerHTML=`
        <div class="next-players">
            ${
                players.map(id=>{
                    const player=getPlayer(id);

                    if(!player) return "";

                    return `
                        <div class="next-player">
                            🏸 ${escapeHTML(player.name)}
                            <small style="font-size:12px;color:#a7f3d0">
                                (${escapeHTML(player.category || "")})
                            </small>
                        </div>
                    `;

                }).join("")
            }
        </div>
    `;
}

/*
=========================================================
WAITING PLAYERS
=========================================================
Players waiting 15 minutes or more are highlighted red.
*/
function renderWaiting(){

    const container=document.getElementById("waiting");

    const players=waitingQueue
        .map(id=>getPlayer(id))
        .filter(player=>player && !player.paid);

    if(!players.length){

        container.innerHTML=`
            <div class="empty" style="width:100%">
                No players waiting.
            </div>
        `;

        return;
    }

    container.innerHTML=players.map(player=>{

        const seconds=getWaitingSeconds(player);
        const alert=seconds >= 15*60;

        return `
            <div class="waiting-player ${alert ? "alert" : ""}">
                ${alert ? "🔴" : "🟢"}
                ${escapeHTML(player.name)}
                <small>
                    ${formatTime(seconds)}
                </small>
            </div>
        `;

    }).join("");
}

function renderClock(){

    const now=new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString();
}

function render(){

    loadData();

    renderCourts();
    renderNextMatch();
    renderWaiting();
    renderClock();
}

/*
=========================================================
LIVE UPDATES
=========================================================
*/
window.addEventListener("storage",event=>{

    if(event.key === STORAGE_KEY){
        render();
    }

});

/*
Also check periodically. This is useful when both pages
are opened locally and the browser does not immediately
fire a storage event in a particular setup.
*/
setInterval(render,1000);

render();
</script>

</body>
</html>
