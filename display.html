<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badminton Court Display</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#07130d;color:#fff}body{padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.title{font-size:34px;font-weight:800}.clock{font-size:24px;font-family:monospace;color:#bbf7d0}.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,1fr);gap:22px}.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}.court{background:#10241a;border:2px solid #245437;border-radius:18px;padding:20px;min-height:330px;box-shadow:0 8px 25px rgba(0,0,0,.25)}.court.playing{border-color:#ef4444}.court-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.court-name{font-size:28px;font-weight:800}.status{padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px;background:#166534}.status.playing{background:#b91c1c}.players{display:grid;gap:10px;margin:18px 0}.player{background:#173a27;border-radius:10px;padding:12px 14px;font-size:20px;font-weight:700}.player small{display:block;font-size:12px;color:#a7f3d0;margin-top:3px}.timer{font-family:monospace;text-align:center;font-size:42px;font-weight:800;margin:15px 0}.shuttle{text-align:center;color:#bbf7d0;font-weight:700}.empty{height:200px;display:flex;align-items:center;justify-content:center;color:#71907e;font-size:20px;text-align:center}.ready{background:#10241a;border:2px solid #245437;border-radius:18px;padding:20px;position:sticky;top:20px;height:max-content}.ready h2{margin:0 0 5px;font-size:27px}.ready .sub{color:#9fb5a8;margin-bottom:18px}.ready-match{background:#173a27;border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid #60a5fa}.ready-match-title{font-size:18px;font-weight:800;margin-bottom:8px;color:#bfdbfe}.ready-player{padding:5px 0;font-size:16px;font-weight:700}.ready-player small{color:#a7f3d0;margin-left:5px;font-weight:400}.queue-item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #294536}.queue-item:last-child{border-bottom:0}.qname{font-size:19px;font-weight:800}.qcat{font-size:12px;color:#a7f3d0;margin-top:3px}.qtime{font-family:monospace;color:#facc15;white-space:nowrap}.totals{margin-top:20px;padding-top:18px;border-top:1px solid #294536;display:grid;gap:10px}.total{display:flex;justify-content:space-between;color:#b9cabe}.total strong{color:#fff}.footer{margin-top:20px;text-align:center;color:#6f8978;font-size:13px}@media(max-width:900px){body{padding:12px}.layout{grid-template-columns:1fr}.ready{position:static}.title{font-size:25px}.courts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="title">🏸 BADMINTON COURTS</div><div class="clock" id="clock"></div></div>
<div class="layout">
  <main class="courts" id="courts"></main>
  <aside class="waiting">
    <h2>Next Available Court</h2>
    <div class="sub">Ready matches waiting for an available court</div>
    <div id="readyMatches"></div>
    <div class="totals">
      <div class="total"><span>Games Completed</span><strong id="games">0</strong></div>
      <div class="total"><span>LM10 Used</span><strong id="lm10">0</strong></div>
      <div class="total"><span>LM60 Used</span><strong id="lm60">0</strong></div>
    </div>
  </aside>
</div>
<div class="footer">This display updates automatically from the Queue Manager.</div>
<script>
const STORAGE_KEY="badmintonQueueManagerData_v7";
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function fmt(sec){sec=Math.max(0,Number(sec)||0);const h=String(Math.floor(sec/3600)).padStart(2,'0');const m=String(Math.floor(sec%3600/60)).padStart(2,'0');const s=String(sec%60).padStart(2,'0');return `${h}:${m}:${s}`}
function getData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return {}}}
function render(){
 const d=getData(), players=d.allPlayers||[], courts=d.courts||[], readyMatches=d.matches||[];
 const byId=new Map(players.map(p=>[p.id,p]));
 const now=Date.now();
 document.getElementById('courts').innerHTML=courts.length?courts.map(c=>{
   let elapsed=Number(c.elapsed)||0;if(c.playing&&c.startTime) elapsed+=Math.floor((now-c.startTime)/1000);
   const match=c.match;
   return `<section class="court ${c.playing?'playing':''}">
    <div class="court-head"><div class="court-name">${esc(c.name||('Court '+c.id))}</div><div class="status ${c.playing?'playing':''}">${c.playing?'PLAYING':'AVAILABLE'}</div></div>
    ${match?`<div class="players">${(match.playerIds||[]).map(id=>{const p=byId.get(id);return p?`<div class="player">${esc(p.name)}<small>${esc(p.category||'')}</small></div>`:''}).join('')}</div><div class="timer">${fmt(elapsed)}</div><div class="shuttle">🏸 ${esc(c.shuttle||'LM10')}</div>`:`<div class="empty">COURT AVAILABLE<br>Waiting for next match</div>`}
   </section>`;
 }).join(''):'<div class="court"><div class="empty">No courts available</div></div>';
 const availableCourts=courts.filter(c=>!c.match);
 const target=availableCourts.length ? availableCourts[0] : null;
 document.getElementById('readyMatches').innerHTML=readyMatches.length
   ? readyMatches.map((m,i)=>{
       const names=(m.playerIds||[]).map(id=>byId.get(id)).filter(Boolean);
       return `<div class="ready-match">
         <div class="ready-match-title">MATCH ${i+1}${i===0&&target?' • NEXT FOR '+esc(target.name||('Court '+target.id)):''}</div>
         ${names.map(p=>`<div class="ready-player">${esc(p.name)} <small>${esc(p.category||'')}</small></div>`).join('')}
       </div>`;
     }).join('')
   : '<div class="empty" style="height:180px;font-size:16px">No ready matches<br>Pair players in the Queue Manager</div>';
 const completed=Array.isArray(d.completedGames)?d.completedGames:[];
 document.getElementById('games').textContent=completed.length||d.totalGamesCounter||0;
 document.getElementById('lm10').textContent=completed.filter(g=>String(g.shuttle).toUpperCase()==='LM10').length||d.totalLM10Counter||0;
 document.getElementById('lm60').textContent=completed.filter(g=>String(g.shuttle).toUpperCase()==='LM60').length||d.totalLM60Counter||0;
 document.getElementById('clock').textContent=new Date().toLocaleTimeString();
}
render();setInterval(render,1000);window.addEventListener('storage',render);window.addEventListener('focus',render);
</script>
</body>
</html>
